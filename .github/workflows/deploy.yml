name: Byg og udgiv Bikerbasen

# Kører hele scripts/build.js automatisk ved hvert push til main, saa
# annonce- og maerkesider, metatags, sitemap og versionsstempel altid er
# opdateret paa den udgivne side — uanset om nogen huskede at koere det
# lokalt foerst. Ingen hemmeligheder noedvendige: Supabase-noeglen i
# js/supabase-config.js er den offentlige anon-noegle, tiltaenkt at ligge i
# klientkode.
#
# Det, der bliver udgivet, er `_site/` — ikke repoet. `path: .` lagde
# crawler/, supabase/, sources/, scripts/, work/ og docs/ paa
# bikerbasen.dk (efterproevet: HTTP 200 paa fem af dem). Allowlisten og
# efterproevningen staar i scripts/udgiv.js.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tillad_fald:
        description: 'Tillad bevidst fald i antal annoncer/kilder (fx en kilde er fravalgt, CLAUDE.md regel 5). Saetter BB_TILLAD_FALD=1.'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Kun ét udgivelsesforsoeg ad gangen. Skubber nogen igen mens et build
# koerer, annulleres det gamle forsoeg til fordel for det nye.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Byg annonce- og maerkesider, metatags og versionsstempel
        env:
          # Kun ved manuel start med tillad_fald = true (scripts/seo-vagt.js).
          BB_TILLAD_FALD: ${{ inputs.tillad_fald && '1' || '' }}
        run: node scripts/build.js
      # Samler _site fra en allowlist og afbryder, hvis en side peger paa en
      # fil, der ikke kom med. Hvorfor allowlist frem for `path: .` staar i
      # scripts/udgiv.js — kort fortalt: crawler/, supabase/, sources/,
      # scripts/, work/ og docs/ laa offentligt paa handelsdomaenet.
      - name: Saml udgivelsen og efterproev at intet mangler
        run: node scripts/udgiv.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Den opdaterede lastmod-ledger gemmes til commit-jobbet nedenfor (S-011).
      - uses: actions/upload-artifact@v4
        with:
          name: sitemap-lastmod
          path: scripts/sitemap-lastmod.json

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Efter en vellykket udgivelse committes den opdaterede lastmod-ledger tilbage til main, saa sitemap-
  # lastmod kun rykker, naar en sides indhold er aendret — ikke ved hver udgivelse (S-011, blind
  # Critic P1-2). Kun filen scripts/sitemap-lastmod.json, kun hvis den er aendret. [skip ci] og
  # GITHUB_TOKEN-pushes udloeser ikke nye workflow-koersler, saa der er aldrig en loekke.
  # Moenster som en almindelig bot-commit; kraever at main tillader github-actions[bot] at pushe.
  lastmod:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: sitemap-lastmod
          path: ${{ runner.temp }}/lastmod
      - name: Commit sitemap-lastmod.json hvis den er aendret
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          cp "$RUNNER_TEMP/lastmod/sitemap-lastmod.json" scripts/sitemap-lastmod.json
          if git diff --quiet -- scripts/sitemap-lastmod.json; then
            echo "sitemap-lastmod.json uaendret - intet at committe."
            exit 0
          fi
          git add scripts/sitemap-lastmod.json
          git commit -m "chore: sitemap-lastmod [skip ci]"
          git push origin HEAD:main
