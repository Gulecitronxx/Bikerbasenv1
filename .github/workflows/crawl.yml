# Planlagt koersel af crawleren (D8-F2: "lige nu"-paastande var 3-7 dage gamle,
# fordi crawleren kun blev koert i haanden).
#
# KRAEVER ét repository secret, foer den goer noget:
#   SUPABASE_SERVICE_ROLE_KEY  (Supabase -> Project Settings -> API)
# Uden den springer jobbet sig selv over med en tydelig besked - intet fejler.
#
# Reglerne fra CLAUDE.md haandhaeves af crawleren selv (robots.txt, 1 req/2s
# pr. domaene, identificerbar User-Agent, opt-out pr. kilde) - cron aendrer
# ikke paa dem, kun paa hvor tit de efterleves.
name: Crawl kilder

# KUN MANUEL KOERSEL — menneskets beslutning 24.08.2026: ingen cron.
# Crawleren koerer udelukkende, naar der trykkes "Run workflow" i Actions-fanen.
# (Konsekvens: "Senest bekraeftet hos kilderne"-datoerne bliver kun friske,
# naar der koeres manuelt.)
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tjek secret
        id: gate
        env:
          NOEGLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$NOEGLE" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY er ikke sat som repository secret - crawleren springes over." >> "$GITHUB_STEP_SUMMARY"
            echo "koer=nej" >> "$GITHUB_OUTPUT"
          else
            echo "koer=ja" >> "$GITHUB_OUTPUT"
          fi
      - name: Installer afhaengigheder
        if: steps.gate.outputs.koer == 'ja'
        run: npm ci --omit=dev || npm install --omit=dev
      - name: Installer Playwright-browseren
        if: steps.gate.outputs.koer == 'ja'
        run: npx playwright install --with-deps chromium
      - name: Koer crawleren
        if: steps.gate.outputs.koer == 'ja'
        env:
          SUPABASE_URL: https://hkcjrwglwurdjnobewzb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Uden --alle printer run.js kun hjaelpeteksten og exit(2) — det var
        # tredje koersels fejl. node kaldes direkte (npm's '--'-videresendelse
        # er en kendt faelde, se filhovedet i crawler/run.js).
        run: node crawler/run.js --alle
