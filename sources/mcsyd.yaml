# MC Syd — Rødding. 332 motorcykler på lager (målt 16.08.2026).
#
# STATUS: klar. URL-struktur, crawl-regler og felt-selectors er alle
# verificeret mod det levende site i en renderet browser.
#
# OM ANTALLET: her stod tidligere "omkring 500". Det er forkert, og det kostede
# en søgning efter 150 motorcykler, der ikke findes. Siden skriver det selv
# nederst i gitteret: "343 ud af 343 resultater". Optalt i renderet DOM er de
# 345 kort = 332 motorcykler + 11 scootere/knallerter + 2 uden produktlink.
# Scooterne sorteres fra af detalje_url_moenster, så 332 er det rigtige tal.
#
# INGEN PAGINERING. Hele listen ligger i DOM'en ved første indlæsning — 345
# kort både før og efter scroll. Der er ingen "vis flere"-knap, ingen
# ?page=-links og ingen efterindlæsning ved scroll. Crawlerens scroll-løkke
# er derfor et sikkerhedsnet, ikke en nødvendighed, for netop denne kilde.

navn: MC Syd
domaene: mcsyd.dk
aktiv: true           # tilladelse modtaget, selectors verificeret

# ---------------------------------------------------------------
# Tilladelse
# ---------------------------------------------------------------
# robots.txt hentet og læst: Allow: / med to disallow-regler, ingen af dem
# rammer /motorcykler/ eller /produkter/. Ingen Crawl-delay angivet, så vi
# bruger vores egen grænse på 2 sekunder.
#
# Skriftlig tilladelse fra MC Syd: MODTAGET 16.08.2026.
# robots.txt er en teknisk regel, ikke en aftale — derfor ventede vi på et ja.
robots_tjekket: 2026-08-16
tilladelse_modtaget: 2026-08-16   # skriftligt ja fra MC Syd
crawl_delay_ms: 2000

# ---------------------------------------------------------------
# Hvordan siden er bygget
# ---------------------------------------------------------------
# Den rå HTML på en mærkeside indeholder 49 links, og INTET af dem peger på
# et produkt. Annoncegitteret injiceres af JavaScript. Bekræftet ved at hente
# https://mcsyd.dk/motorcykler/harley-davidson-motorcykler/ med curl:
# 48.807 bytes, nul forekomster af /produkter/motorcykel/.
#
# Sitet kører på Danbase, et dansk forhandlersystem. Bekræftet tre steder:
# stylesheet-bundtet /styles/danbase, kortklassen .dd-entity, og at fotos
# serveres fra images.danbase.dk/Content/Resellers/321/.
#
# VIGTIGT for de næste kilder: jeg grep'ede de fem andre forhandleres FORSIDE
# for "danbase" og fik nul. Det svar er ikke pålideligt — markørerne står på
# annoncesiderne, ikke på forsiden. Tjek dem på deres /motorcykler/-side, før
# I skriver fem separate YAML-filer. Er de også Danbase, virker selectorene
# nedenfor uændret, fordi data-key er platformens, ikke MC Syds.
kraever_browser: true

# HMC MOTORCYKLER ER UDE — undersøgt og afvist 16.08.2026.
# Deres mærkesider er tomme skabeloner. Lageret ligger i en iframe fra
# 123mc.dk (/forhandlerside/hmc-motorcykler/846/), altså en tredjepartsportal
# bag Cloudflare. Tilladelsen var fra HMC, ikke fra 123mc, og et ja fra den
# ene er ikke et ja fra den anden. Undersøg ikke hmcmotorcykler.dk igen — der
# er intet at hente dér, og svaret ligger et sted, vi ikke har adgang til.

# BESLUTTET 16.08.2026: vi bliver ved Playwright og den renderede DOM.
#
# Gitteret bygges af et JSON-endpoint hos platformsleverandøren:
#   POST https://websiteapi.danbase.dk/v1/321/product/search
# Det er fristende — én forespørgsel i stedet for en browser, formentlig med
# flere felter end kortene viser, og markant billigere for de næste fem
# forhandlere, hvis de også kører Danbase.
#
# Vi bruger det alligevel ikke. Tilladelsen fra MC Syd gælder deres website.
# Et udokumenteret internt API hos deres leverandør er ikke det samme, og
# hverken MC Syd eller Danbase har sagt ja til det. Aftalen er grunden til, at
# vi overhovedet må hente det her — den skal ikke udvides af en genvej.
#
# Find ikke endpointet igen om et halvt år og tro, det er en forbedring.
# Spørg i stedet Danbase, hvis hastigheden bliver et reelt problem.

# ---------------------------------------------------------------
# Hvor annoncerne findes
# ---------------------------------------------------------------
# Mærkesiderne bruges frem for /alle-motorcykler/, fordi mærket dermed er
# kendt fra URL'en og ikke skal udledes af titlen — det er den hyppigste
# kilde til forkert mærke i et aggregeret katalog.
liste_urler:
  - url: https://mcsyd.dk/motorcykler/alle-motorcykler/
    maerke: null
  - url: https://mcsyd.dk/motorcykler/brugte-honda-motorcykler/
    maerke: Honda
  - url: https://mcsyd.dk/motorcykler/yamaha-motorcykler/
    maerke: Yamaha
  - url: https://mcsyd.dk/motorcykler/bmw-motorcykler/
    maerke: BMW
  - url: https://mcsyd.dk/motorcykler/kawasaki-motorcykler/
    maerke: Kawasaki
  - url: https://mcsyd.dk/motorcykler/ducati-motorcykler/
    maerke: Ducati
  - url: https://mcsyd.dk/motorcykler/triumph-motorcykler/
    maerke: Triumph
  - url: https://mcsyd.dk/motorcykler/harley-davidson-motorcykler/
    maerke: Harley-Davidson

# Detalje-URL. VERIFICERET i browser, og den rettede mit første gæt:
#   https://mcsyd.dk/Produkter/Motorcykel/Brugt/Harley-Davidson%20XL883%20Standard%20Cruiser/178201?p=178201&m=1528
#
# Tre ting, der alle ville have givet nul annoncer:
#   1. Stien har STORE begyndelsesbogstaver — /Produkter/Motorcykel/Brugt/.
#      Søgeresultater viser den med små, men serveren skriver den med store,
#      og en case-sensitiv selector finder ingenting.
#   2. Titlen står URL-kodet i stien (%20 for mellemrum), ikke som slug.
#   3. Der er en ekstra parameter m=1528 ud over p=. Formålet er ukendt;
#      den skal ikke bruges til noget, men et mønster der kræver at URL'en
#      slutter efter p= vil fejle.
#
# Det numeriske id er kilde_annonce_id. Stabilt på tværs af kørsler; titlen i
# stien kan ændre sig, hvis forhandleren retter den.
detalje_url_moenster: '(?i)/produkter/motorcykel/[^/]+/[^/]+/(\d+)'
id_gruppe: 1

# ---------------------------------------------------------------
# Felter — VERIFICERET i renderet DOM 16.08.2026
# ---------------------------------------------------------------
# Danbase mærker felterne SEMANTISK med data-key, ikke med stilklasser.
# Det er en gave: attributterne overlever et designskift, hvor .dd-data.value
# kan blive omdøbt i morgen. Vælg derfor ALTID data-key frem for klassen.
#
# Rå tekst hentes som den står ("99.800", "31.000") og køres gennem
# crawler/normalize.js. Bemærk at Danbase allerede har formateret tallene med
# dansk tusindtalsseparator (data-format="decimal"), så parsePris og parseKm
# er præcis dét, der skal til — punktum må ikke læses som decimaltegn.
#
# Målt på Harley-siden: 40 kort i DOM'en, 38 produktlinks.
selectors:
  kort: 'div.product.dd-entity'
  url: 'a[data-key="Id"][data-format="productlink"]'          # href
  titel: '[data-key="ModelDescription"]'
  pris: '[data-key="Price"]'                                  # "99.800"
  aargang: '[data-key="Year"]'                                # "2007"
  km: '[data-key="Mileage"]'                                  # "31.000"
  ccm: '[data-key="CC"]'                                      # "883"
  hk: '[data-key="HP"]'                                       # "53"
  thumbnail: 'img[data-key="Image"]'                          # src

# Titlen står i to varianter — hidden-xs og visible-xs — med samme data-key.
# Tag den FØRSTE; ellers får du teksten to gange sammensat.
tag_foerste_traef: true

# Sælgertype er givet: MC Syd er forhandler. Alle deres annoncer er
# forhandlerannoncer, og det skal stå på kortet, fordi det afgør købers
# reklamationsret.
faste_felter:
  saelgertype: forhandler
  by: Rødding
  postnr: '6630'
