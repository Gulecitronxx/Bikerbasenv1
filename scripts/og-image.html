<!doctype html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Bikerbasen — delingsbillede</title>
<!--
  Kilde til og-image.png (1200×630), det billede Facebook, Messenger og
  LinkedIn viser når nogen deler et link til siden.

  Sådan opdateres billedet: åbn filen i en browser i 1200×630 og gem et
  screenshot som og-image.png i projektets rod. Facebook cacher billedet —
  kør URL'en gennem developers.facebook.com/tools/debug/ bagefter.

  PNG frem for SVG: Facebook og LinkedIn understøtter ikke SVG som og:image.
-->
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    width:1200px; height:630px; overflow:hidden;
    background:#1C1A18; color:#fff;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display:flex; flex-direction:column; justify-content:center;
    padding:0 90px; position:relative;
  }
  /* Varm glød i hjørnet, så billedet ikke er en flad sort firkant i et feed. */
  body::before{
    content:''; position:absolute; right:-160px; top:-160px;
    width:760px; height:760px; border-radius:50%;
    background: radial-gradient(circle, rgba(198,66,14,.55) 0%, rgba(198,66,14,0) 68%);
  }
  .brand{ display:flex; align-items:center; gap:20px; margin-bottom:44px; position:relative; }
  .brand svg{ width:76px; height:76px; color:#C6420E; }
  .brand span{ font-size:52px; font-weight:800; letter-spacing:-.02em; }
  .brand em{ font-style:normal; color:#FF6A32; }
  h1{ font-size:74px; line-height:1.06; font-weight:800; letter-spacing:-.03em; max-width:940px; position:relative; }
  p{ font-size:31px; color:#C7C1B8; margin-top:28px; max-width:820px; position:relative; }
  .strip{ display:flex; gap:14px; margin-top:52px; position:relative; }
  .strip b{
    font-size:23px; font-weight:600; padding:13px 26px; border-radius:999px;
    background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.16);
  }
</style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="5.5" cy="17" r="3.2"/><circle cx="18.5" cy="17" r="3.2"/>
      <path d="M5.5 17 9 10h5l3 4.2M9 10 7.7 7h-2M13 14.2l1.6-4.2M15 7h3l1 3.5"/>
    </svg>
    <span>Biker<em>basen</em></span>
  </div>
  <h1>Køb og sælg brugte motorcykler i Danmark</h1>
  <p>Søg på mærke, udstyr, kørekort og budget — og kom direkte i kontakt med sælgeren.</p>
  <div class="strip">
    <b>Gratis for private</b>
    <b>Verificerede forhandlere</b>
    <b>Hele landet</b>
  </div>
</body>
</html>
