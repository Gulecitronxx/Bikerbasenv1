<script>
/* Afmelding skal kunne ske UDEN login — man klikker i en mail, ofte på en
   anden enhed end den man er logget ind på. Derfor et token pr. søgeagent:
   funktionen unsubscribe_saved_search (migration 013) kører security
   definer og slår præcis den ene agent fra. Et lækket link kan altså ikke
   bruges til andet end at stoppe netop de mails. */
(async () => {
  const titel = document.getElementById('afmeld-titel');
  const tekst = document.getElementById('afmeld-tekst');
  const handlinger = document.getElementById('afmeld-handlinger');
  const vis = (t, b) => { titel.textContent = t; tekst.textContent = b; handlinger.hidden = false; };

  const token = new URLSearchParams(location.search).get('token');
  if (!token){
    vis('Linket mangler en kode', 'Brug afmeldingslinket nederst i den mail, du har modtaget.');
    return;
  }

  try {
    const url = 'https://hkcjrwglwurdjnobewzb.supabase.co';
    const key = 'sb_publishable_m_ZXdYaGVARkJRyDyyJJhA_9lgcw-t5';
    const r = await fetch(url + '/rest/v1/rpc/unsubscribe_saved_search', {
      method: 'POST',
      headers: { apikey: key, Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_token: token }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const fundet = await r.json();
    if (fundet){
      vis('Du er afmeldt', 'Du får ikke flere mails fra den søgeagent. Dine andre søgeagenter kører videre — dem kan du styre under Mine annoncer.');
    } else {
      // Enten et ukendt token eller en agent der allerede var slået fra.
      // Begge dele er samme resultat for brugeren: der kommer ikke flere mails.
      vis('Der kommer ikke flere mails', 'Søgeagenten er enten allerede afmeldt eller findes ikke længere.');
    }
  } catch (e) {
    vis('Vi kunne ikke afmelde dig lige nu', 'Prøv linket igen om lidt. Virker det stadig ikke, kan du slå søgeagenten fra under Mine annoncer.');
  }
})();
</script>
